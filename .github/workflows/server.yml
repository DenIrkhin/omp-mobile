name: server

on:
  push:
    paths: ["server/**", "api/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "api/**", ".github/workflows/server.yml"]

jobs:
  test:
    # flock.ts loads libc.dylib at import, so the tests need macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: server/.bun-version
      - name: Install
        working-directory: server
        run: bun install --frozen-lockfile
      - name: Type-check
        working-directory: server
        run: bun run check
      - name: Test
        working-directory: server
        run: bun test
